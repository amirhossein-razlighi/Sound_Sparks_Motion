# =============================================================================
# Template config — fill in the fields marked <FILL> and run:
#   bash editing/scripts/run.sh editing/configs/yours.yaml
#
# Required env vars (set in your shell before running):
#   export CKPT_ROOT=/path/to/dir/containing/ltx-2.3-22b-dev.safetensors
#   export QWEN_ROOT=/path/to/Qwen2.5-VL-7B-Instruct
#   export GEMMA_ROOT=/path/to/gemma-3-12b-it-qat-q4_0-unquantized
# =============================================================================

# --- Input (required) --------------------------------------------------------
src_video: "<FILL: e.g. input_videos/my_video.mp4>"
edit_prompt: "<FILL: e.g. The dog stands up and stretches.>"
static_prompt: "<FILL: e.g. A dog sitting on a chair.>  # before-state description for CLIP diagnostics"
negative_prompt: "blurry, low quality, artifacts, distorted"

# --- Experiment --------------------------------------------------------------
experiment_name: "<FILL: short label used as output subdirectory name>"
opt_mode: "both"        # text | audio | both
seed: 42
enhance_prompt: true    # let the model enhance the text prompt automatically

# --- Video dimensions (keep defaults unless your video differs) --------------
height: 320
width:  512
num_frames: 95
frame_rate: null        # null = auto-detect from source video

# --- Optimization ------------------------------------------------------------
iterations: 30
early_stopping: 15      # stop if no improvement for this many steps
lr: 0.005
lr_schedule: "cosine"
grad_clip: 0.0
best_min_loss_delta: 0.0
retake_start_frames: 5  # how many frames from the start are re-generated
num_inference_steps: 30
retake_num_inference_steps: 30
final_retake_num_inference_steps: 30
audio_opt_last_steps: 8

# --- Qwen2.5-VL supervision --------------------------------------------------
# qwen_max_frames: number of frames Qwen sees per iteration.
#   8  → fast, good for single clear motions
#   24 → better for complex / longer-range motions
#   30 → most expressive but slowest
qwen_max_frames: 8
qwen_img_size: 224
qwen_sample_mode: "linspace"   # linspace | normal
qwen_contiguous_start_frame: 4
qwen_gradient_rubric: "motion"
qwen_grad_accum_steps: 3       # gradient accumulation (1 = no accum, 3 = default)

# --- Perceptual regularization -----------------------------------------------
# Set lpips_weight > 0 to penalize large perceptual changes (helps preserve identity).
# A good starting point if you want regularization: lpips_weight=0.1, temporal_weight=0.05
lpips_weight: 0.0       # 0.0 = disabled; try 0.1 to enable
temporal_weight: 0.0    # 0.0 = disabled; try 0.05 alongside lpips_weight
lpips_backbone: "alex"
latent_reg_weight: 0.01
text_reg_weight: 0.001
reg_schedule: "cosine_increase"

# --- Evaluation diagnostics --------------------------------------------------
clip_similarity_diag: true
clip_model: "openai/clip-vit-base-patch32"
clip_max_frames: 0      # 0 = all frames
clip_batch_size: 8
max_eval_frames: 95
frame_stride: 1
visualize_every_iters: 5

# --- Runtime -----------------------------------------------------------------
quantization: "fp8-cast"
low_memory_guidance: true
save_final_videos: true
gradient_checkpointing: true

# --- Experiment tracking -----------------------------------------------------
wandb_project: "sound-sparks-motion"
wandb_tags: "qwen-loss"
wandb_mode: "offline"   # offline | online | disabled
