# Usage:  bash editing/scripts/rebuttal/run_variant.sh editing/configs/rebuttal/falcon_bird_opening_wings.yaml <source|zero|random_s42|random_s1|random_s2>

src_video: "input_videos/a_falcon_bird_sitting_on_a_tree.mp4"
edit_prompt: "A bird openning its wings."
static_prompt: "A bird sitting on a branch of tree."
negative_prompt: "blurry, low quality, artifacts, distorted"

experiment_name: "falcon_bird_opening_wings"
opt_mode: "both"
seed: 42

# --- Audio-init ablation (rebuttal Priority 1) -----------------------------
# These keys define the SOURCE/ours baseline. The rebuttal runner
# (editing/scripts/rebuttal/run_variant.sh) overrides them per variant:
#   source     -> audio_init=source, audio_reg_anchor=source   (ours, reg ON)
#   zero       -> audio_init=zero,   audio_reg_anchor=none      (reg OFF)
#   random_s*  -> audio_init=random, audio_reg_anchor=none, audio_init_seed=*
# The diffusion --seed stays 42 for every variant so the baseline render is
# identical and variants are directly comparable.
audio_init: "source"
audio_reg_anchor: "source"
audio_init_seed: 42
enhance_prompt: false   # disabled for all ablations (no prompt rewriting)

height: 320
width:  512
num_frames: 95
frame_rate: null

iterations: 30
early_stopping: 15
lr: 0.005
lr_schedule: "cosine"
grad_clip: 0.0
best_min_loss_delta: 0.0
retake_start_frames: 5
num_inference_steps: 30
retake_num_inference_steps: 30
final_retake_num_inference_steps: 30
audio_opt_last_steps: 8

qwen_max_frames: 30
qwen_img_size: 224
qwen_sample_mode: "linspace"
qwen_contiguous_start_frame: 4
qwen_gradient_rubric: "motion"
qwen_grad_accum_steps: 3

lpips_weight: 0.1
temporal_weight: 0.05
lpips_backbone: "alex"
latent_reg_weight: 0.01
text_reg_weight: 0.001
reg_schedule: "cosine_increase"

clip_similarity_diag: true
clip_model: "openai/clip-vit-base-patch32"
clip_max_frames: 0
clip_batch_size: 8
max_eval_frames: 95
frame_stride: 1
visualize_every_iters: 5

quantization: "fp8-cast"
low_memory_guidance: true
save_final_videos: true
gradient_checkpointing: true

wandb_project: "sound-sparks-motion"
wandb_tags: "qwen-loss"
wandb_mode: "offline"
