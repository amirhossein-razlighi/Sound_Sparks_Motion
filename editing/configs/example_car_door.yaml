# =============================================================================
# Example config: red car door opening
#
#
# Usage:
#   bash editing/scripts/run.sh editing/configs/example_car_door.yaml
# =============================================================================

# --- Input video and prompts ---
src_video: "input_videos/a_red_car_in_a_garage.mp4"
edit_prompt: "A red car door opens."
static_prompt: "A red car in the middle of a garage."
negative_prompt: "blurry, low quality, artifacts, distorted"

# --- Experiment ---
experiment_name: "car_door_open"
opt_mode: "both"
seed: 42
enhance_prompt: true

# --- Video dimensions ---
height: 320
width: 512
num_frames: 95
frame_rate: null

# --- Optimization ---
iterations: 30
early_stopping: 15
lr: 0.005
lr_schedule: "cosine"
grad_clip: 0.0
best_min_loss_delta: 0.0
retake_start_frames: 5
num_inference_steps: 30
retake_num_inference_steps: 30
final_retake_num_inference_steps: 30
audio_opt_last_steps: 8

# --- Qwen2.5-VL supervision ---
qwen_max_frames: 8
qwen_img_size: 224
qwen_sample_mode: "linspace"
qwen_contiguous_start_frame: 4
qwen_gradient_rubric: "motion"
qwen_grad_accum_steps: 3

# --- Perceptual regularization ---
lpips_weight: 0.0
temporal_weight: 0.0
lpips_backbone: "alex"
latent_reg_weight: 0.01
text_reg_weight: 0.001
reg_schedule: "cosine_increase"

# --- Evaluation diagnostics ---
clip_similarity_diag: true
clip_model: "openai/clip-vit-base-patch32"
clip_max_frames: 0
clip_batch_size: 8
max_eval_frames: 95
frame_stride: 1
visualize_every_iters: 5

# --- Runtime ---
quantization: "fp8-cast"
low_memory_guidance: true
save_final_videos: true
gradient_checkpointing: true

# --- Experiment tracking ---
wandb_project: "sound-sparks-motion"
wandb_tags: "qwen-loss,text-mode"
wandb_mode: "offline"
