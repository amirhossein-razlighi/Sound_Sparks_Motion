# Usage:  bash editing/scripts/transfer.sh editing/configs/transfer/man_pets_dog_transfer.yaml
#
# opt_dir must point to the mode_both (or mode_text / mode_audio) folder
# produced by a previous optimization run.
# The path below is relative to the repo root.

target_video: "input_videos/a_man_and_a_dog_in_front.mp4"
opt_dir: "results/QwenVL/the_man_pets_the_dog./linspace_w_lpips/both/mode_both"
mode: "both"

edit_prompt: "The man pets the dog."
static_prompt: "A man and a dog in front of a bench."
negative_prompt: "blurry, low quality, artifacts, distorted"

experiment_name: "man_pets_dog_transfer"
seed: 42
enhance_prompt: true

height: 320
width:  512
num_frames: 95
frame_rate: null

num_inference_steps: 30
retake_start_frames: 5
qwen_eval_frames: 16

clip_diag: true
clip_model: "openai/clip-vit-base-patch32"
clip_max_frames: 0

quantization: "fp8-cast"
